name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install "mkdocs<2" mkdocs-material pymdown-extensions mkdocstrings-python mkdocs-static-i18n

      - name: Build & deploy to GitHub Pages
        run: |
          mkdocs gh-deploy --force --clean --message "Deploy documentation from {sha}"
